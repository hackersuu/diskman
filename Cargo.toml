[package]
name = "diskman"
version = "0.1.3"
edition = "2021"
description = "Linux external disk auto-mounter with LUKS support"
license = "GPL-2.0"
authors = []

[[bin]]
name = "diskman"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["mount", "fs"] }

[profile.release]
opt-level = 3
lto = true
strip = true
